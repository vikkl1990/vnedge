# VNEDGE is measurement-first. The default service has no signal-producing
# strategy and no live adapter. Research is opt-in; paper capital requires two
# explicit environment gates and a registered capital-eligible strategy.
services:
  multi-lane-shadow:
    build:
      context: .
      args:
        VNEDGE_BUILD_SHA: "${VNEDGE_BUILD_SHA:-dev}"
    restart: unless-stopped
    # The entrypoint reruns delta-backfill + exact-volume readiness before the
    # runtime on every container start, including daemon/host restarts.
    command: ["python", "-m", "vnedge.runtime.scanner_startup"]
    environment:
      VNEDGE_HOST: "${VNEDGE_HOST:-}"
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_TOKEN: "${DASHBOARD_TOKEN:?set DASHBOARD_TOKEN in .env}"
      DASHBOARD_USERS: "${DASHBOARD_USERS:-}"
      DASHBOARD_JWT_SECRET: "${DASHBOARD_JWT_SECRET:-}"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-true}"
      # /health is process liveness; /ready additionally consumes this
      # cross-process evidence and fails while the canonical lake has holes.
      CANDLE_LAKE_HEALTH_PATH: data/gaps/lake_health.json
      CANDLE_LAKE_HEALTH_MAX_AGE_SECONDS: "${CANDLE_LAKE_HEALTH_MAX_AGE_SECONDS:-1200}"
      SCANNER_PREREQ_HEALTH_PATH: data/reports/scanner_startup_health.json
      VNEDGE_SECRETS_KEY: "${VNEDGE_SECRETS_KEY:-}"
      VNEDGE_SECRETS_KEY_VERSION: "${VNEDGE_SECRETS_KEY_VERSION:-1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      MULTI_LANE_EXCHANGES: "${MULTI_LANE_EXCHANGES:-binanceusdm,bybit,delta_india}"
      MULTI_LANE_SYMBOLS: "${MULTI_LANE_SYMBOLS:-BTC/USDT:USDT}"
      MULTI_LANE_TIMEFRAME: "${MULTI_LANE_TIMEFRAME:-1h}"
      # Empty/off is intentional. Both must be supplied for a PAPER lane.
      MULTI_LANE_CAPITAL_ENABLED: "${MULTI_LANE_CAPITAL_ENABLED:-0}"
      MULTI_LANE_CAPITAL_STRATEGY: "${MULTI_LANE_CAPITAL_STRATEGY:-}"
      MULTI_LANE_CAPITAL_EXCHANGE: "${MULTI_LANE_CAPITAL_EXCHANGE:-binanceusdm}"
      MULTI_LANE_CAPITAL_SYMBOL: "${MULTI_LANE_CAPITAL_SYMBOL:-BTC/USDT:USDT}"
      MULTI_LANE_CAPITAL_TIMEFRAME: "${MULTI_LANE_CAPITAL_TIMEFRAME:-1h}"
      # Optional virtual-only research observation. Both gates are required.
      MULTI_LANE_SHADOW_OBSERVE_ENABLED: "${MULTI_LANE_SHADOW_OBSERVE_ENABLED:-0}"
      MULTI_LANE_SHADOW_OBSERVE_STRATEGY: "${MULTI_LANE_SHADOW_OBSERVE_STRATEGY:-}"
      MULTI_LANE_SHADOW_OBSERVE_EXCHANGE: "${MULTI_LANE_SHADOW_OBSERVE_EXCHANGE:-binanceusdm}"
      MULTI_LANE_SHADOW_OBSERVE_COST_EXCHANGE: "${MULTI_LANE_SHADOW_OBSERVE_COST_EXCHANGE:-delta_india}"
      MULTI_LANE_SHADOW_OBSERVE_SYMBOL: "${MULTI_LANE_SHADOW_OBSERVE_SYMBOL:-BTC/USDT:USDT}"
      MULTI_LANE_SHADOW_OBSERVE_SYMBOLS: "${MULTI_LANE_SHADOW_OBSERVE_SYMBOLS:-}"
      MULTI_LANE_SHADOW_OBSERVE_TIMEFRAME: "${MULTI_LANE_SHADOW_OBSERVE_TIMEFRAME:-1h}"
      MULTI_LANE_SHADOW_OBSERVE_EQUITY: "${MULTI_LANE_SHADOW_OBSERVE_EQUITY:-500}"
      MULTI_LANE_SHADOW_OBSERVE_DAILY_LOSS_USD: "${MULTI_LANE_SHADOW_OBSERVE_DAILY_LOSS_USD:-10}"
      MULTI_LANE_SHADOW_OBSERVE_TRAIL_ATR_MULT: "${MULTI_LANE_SHADOW_OBSERVE_TRAIL_ATR_MULT:-0}"
      # Versioned multi-strategy replacement for the singleton fields above.
      # Setting a path is the explicit opt-in; mixing both contracts fails startup.
      MULTI_LANE_SHADOW_OBSERVE_ROSTER_PATH: "${MULTI_LANE_SHADOW_OBSERVE_ROSTER_PATH:-}"
      # Optional fixed isolated-margin sizing for PAPER/SHADOW only. The live
      # runtime rejects this profile structurally. Leverage is capped at 30x
      # and automatically reduced when required to preserve liquidation room.
      MULTI_LANE_FIXED_MARGIN: "${MULTI_LANE_FIXED_MARGIN:-}"
      MULTI_LANE_FIXED_MARGIN_LEVERAGE: "${MULTI_LANE_FIXED_MARGIN_LEVERAGE:-30}"
      MULTI_LANE_DAILY_LOSS_HALT: "${MULTI_LANE_DAILY_LOSS_HALT:-1}"
      VISION_BACKFILL_DAYS: "${VISION_BACKFILL_DAYS:-24}"
      SCANNER_PREREQ_SYMBOLS: "${SCANNER_PREREQ_SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      # A fresh volume may require a large exact aggTrade seed before the HTTP
      # runtime exists. Existing volumes normally process only a short delta.
      start_period: 1800s
    # Nine-lane cold start loads the exchange warm-up frames concurrently
    # before shared feeds and frame lifetimes settle. It crossed a 3 GiB
    # ceiling in production, so retain bounded but operational headroom.
    mem_limit: 6g
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./research/live_research:/app/research/live_research:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Public-trade measurement service for Market Pulse. It has no credentials,
  # order adapter, strategy, or capital path and never substitutes venue OHLCV
  # for exact trade-derived VWAP.
  pulse-recorder:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.exchange.tick_recorder
      - --exchange
      - binanceusdm
      - --symbols
      - BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT
      - --data-root
      - data
      - --candle-root
      - data/candles
      - --trades-only
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time,sys;
          files=list(pathlib.Path('data/ticks/exchange=binanceusdm').glob('symbol=*/stream=trades/*/*.parquet'));
          sys.exit(0 if files and time.time()-max(p.stat().st_mtime for p in files)<180 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # Explicit fail-closed repair worker. The recorder only detects/publishes
  # holes; this worker repairs Binance storage_hole records from aggregate
  # trades with strict contiguous trade-ID proof, then deterministically
  # rebuilds the canonical candle ladder. A failed proof leaves the gap open.
  gap-recovery:
    build: .
    restart: unless-stopped
    depends_on:
      pulse-recorder:
        condition: service_started
      # The scanner entrypoint owns the serialized cold-start repair. Do not
      # let the periodic worker mutate the same candle store until that proof
      # has completed and the runtime is healthy.
      multi-lane-shadow:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        until python -c "import json,sys; p=json.load(open('data/reports/scanner_startup_health.json')); sys.exit(0 if p.get('status') == 'ready' else 1)" 2>/dev/null; do sleep 15; done
        while true; do
          python -m vnedge.data.binance_gap_recovery \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --data-root data \
            --candle-root data/candles \
            --gap-root data/gaps \
            --tail-timeframe 5m \
            --report data/reports/binance_gap_recovery.json
          sleep 900
        done
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys; from datetime import datetime; p=json.load(open('data/reports/binance_gap_recovery.json')); age=time.time()-datetime.fromisoformat(p['generated_at']).timestamp(); sys.exit(0 if age < 1200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # Binance REST retains aggTrades for only two days. Official Vision daily
  # archives own older storage holes; replay stays trade-derived and never
  # substitutes exchange OHLCV. Existing day archives are skipped.
  vision-recovery:
    build: .
    restart: unless-stopped
    depends_on:
      # Avoid concurrent historical candle rebuilds against scanner_startup.
      multi-lane-shadow:
        condition: service_healthy
    environment:
      VISION_BACKFILL_DAYS: "${VISION_BACKFILL_DAYS:-24}"
    command:
      - sh
      - -c
      - |
        set -e
        until python -c "import json,sys; p=json.load(open('data/reports/scanner_startup_health.json')); sys.exit(0 if p.get('status') == 'ready' else 1)" 2>/dev/null; do sleep 15; done
        while true; do
          required_days="$${VISION_BACKFILL_DAYS}"
          if [ "$${required_days}" -lt 24 ]; then required_days=24; fi
          python -m vnedge.data.aggtrades_backfill \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --days "$${required_days}" \
            --data-root data \
            --exchange binanceusdm_hist \
            --concurrency 1
          python -m vnedge.data.candle_bootstrap \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --days "$${required_days}" \
            --data-root data \
            --candle-root data/candles \
            --source-exchange binanceusdm_hist \
            --target-exchange binanceusdm
          sleep 86400
        done
    volumes:
      - ./data:/app/data
    mem_limit: 1400m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  tick-lake-maintenance:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.data.tick_lake_maintenance
      - --data-root
      - data
      - --interval-seconds
      - "86400"
      - --report
      - data/reports/tick_lake_maintenance.json
    volumes:
      - ./data:/app/data
    mem_limit: 1200m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys; p=json.load(open('data/reports/tick_lake_maintenance.json')); t=p.get('generated_at'); from datetime import datetime; age=time.time()-datetime.fromisoformat(t).timestamp(); sys.exit(0 if age < 90000 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}


  # L2 order-book recorder. Separate from pulse-recorder, which is
  # deliberately --trades-only for Market Pulse. Book recording died on
  # 2026-08-02 12:46 UTC and nothing restarted it because no service owned it;
  # the whole point of this entry is that the L2 lake now has an owner with a
  # restart policy and a healthcheck that fails when book files go stale.
  book-recorder:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.exchange.tick_recorder
      - --exchange
      - binanceusdm
      - --symbols
      - BTC/USDT:USDT,ETH/USDT:USDT
      - --data-root
      - data
      - --books-only
    volumes:
      - ./data:/app/data
    # The 50-level ladder is far heavier than the trade stream; 600m (the
    # pulse-recorder budget) is not enough for it.
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time,sys;
          files=list(pathlib.Path('data/ticks/exchange=binanceusdm').glob('symbol=*/stream=book/*/*.parquet'));
          sys.exit(0 if files and time.time()-max(p.stat().st_mtime for p in files)<300 else 1)
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
  research-loop:
    profiles: ["research"]
    build: .
    restart: unless-stopped
    command: ["python", "-m", "vnedge.research.continuous_research"]
    environment:
      RESEARCH_INTERVAL_SECONDS: "${RESEARCH_INTERVAL_SECONDS:-3600}"
      RESEARCH_EXCHANGES: "${RESEARCH_EXCHANGES:-binanceusdm,bybit,delta_india}"
      RESEARCH_SYMBOLS: "${RESEARCH_SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT}"
      RESEARCH_STRATEGIES: "${RESEARCH_STRATEGIES:-}"
      ALPHA_FACTORY_ENABLED: "0"
    volumes:
      - ./data:/app/data
      - ./research/live_research:/app/research/live_research
      - ./logs:/app/logs:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Daily, read-only scanner evidence. It reads append-only lane journals and
  # writes one atomic aggregate artifact; it has no exchange credentials,
  # strategy mutation, promotion, or order authority.
  scanner-evidence:
    build: .
    restart: unless-stopped
    depends_on:
      multi-lane-shadow:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        while true; do
          set --
          for journal in /app/logs/paper_trials/*.journal.jsonl; do
            if [ -f "$${journal}" ]; then set -- "$${@}" --journal "$${journal}"; fi
          done
          python -m vnedge.research.scanner_evidence "$${@}" \
            --out /app/research/live_research/scanner_evidence_latest.json
          sleep 300
        done
    volumes:
      - ./logs:/app/logs:ro
      - ./research/live_research:/app/research/live_research
    mem_limit: 300m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys; p=json.load(open('/app/research/live_research/scanner_evidence_latest.json')); t=p.get('generated_at'); from datetime import datetime; age=time.time()-datetime.fromisoformat(t).timestamp(); sys.exit(0 if age < 900 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # Read-only ML readiness publisher. It measures the resolved-label dataset
  # and locked validation gates; it never trains a live model or changes a
  # strategy. The System page declares this as a two-hour optional product, so
  # it must have an explicit owner instead of serving a week-old JSON file.
  ml-pipeline-status:
    build: .
    restart: unless-stopped
    depends_on:
      multi-lane-shadow:
        condition: service_healthy
    command:
      - python
      - -m
      - vnedge.research.ml_pipeline_status
      - --lane-dir
      - logs/paper_trials
      - --data-root
      - data/normalized
      - --output
      - research/live_research/ml_pipeline_status.json
      - --interval-seconds
      - "3600"
    volumes:
      - ./logs:/app/logs:ro
      - ./data:/app/data:ro
      - ./research/live_research:/app/research/live_research
    mem_limit: 900m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys; from datetime import datetime; p=json.load(open('research/live_research/ml_pipeline_status.json')); age=time.time()-datetime.fromisoformat(p['generated_at']).timestamp(); sys.exit(0 if age < 7200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # Research-only supervisor publisher. It joins existing evidence into an
  # operator queue; it has no execution, mutation, or promotion authority.
  agentic-research-os:
    build: .
    restart: unless-stopped
    depends_on:
      multi-lane-shadow:
        condition: service_healthy
    command:
      - python
      - -m
      - vnedge.research.agentic_research_os
      - --interval-seconds
      - "900"
    volumes:
      - ./logs:/app/logs:ro
      - ./research/live_research:/app/research/live_research
    mem_limit: 300m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys; from datetime import datetime; p=json.load(open('research/live_research/agentic_research_os_latest.json')); age=time.time()-datetime.fromisoformat(p['generated_at']).timestamp(); sys.exit(0 if age < 1800 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  dashboard-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      multi-lane-shadow:
        condition: service_healthy
    environment:
      DASHBOARD_ALLOWLIST: "${DASHBOARD_ALLOWLIST:-}"
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:-}"
    command:
      - sh
      - -c
      - |
        DASHBOARD_ALLOWLIST="$$(printf '%s' "$$DASHBOARD_ALLOWLIST" | tr ',' ' ')"
        if [ -z "$$(printf '%s' "$$DASHBOARD_ALLOWLIST" | tr -d ' ')" ]; then
            unset DASHBOARD_ALLOWLIST
        else
            export DASHBOARD_ALLOWLIST
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
