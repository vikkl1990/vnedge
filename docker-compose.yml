# VNEDGE is measurement-first. The default service has no signal-producing
# strategy and no live adapter. Research is opt-in; paper capital requires two
# explicit environment gates and a registered capital-eligible strategy.
services:
  multi-lane-shadow:
    build:
      context: .
      args:
        VNEDGE_BUILD_SHA: "${VNEDGE_BUILD_SHA:-dev}"
    restart: unless-stopped
    command: ["python", "-m", "vnedge.runtime.multi_lane_shadow"]
    environment:
      VNEDGE_HOST: "${VNEDGE_HOST:-}"
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_TOKEN: "${DASHBOARD_TOKEN:?set DASHBOARD_TOKEN in .env}"
      DASHBOARD_USERS: "${DASHBOARD_USERS:-}"
      DASHBOARD_JWT_SECRET: "${DASHBOARD_JWT_SECRET:-}"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-true}"
      # /health is process liveness; /ready additionally consumes this
      # cross-process evidence and fails while the canonical lake has holes.
      CANDLE_LAKE_HEALTH_PATH: data/gaps/lake_health.json
      CANDLE_LAKE_HEALTH_MAX_AGE_SECONDS: "${CANDLE_LAKE_HEALTH_MAX_AGE_SECONDS:-1200}"
      VNEDGE_SECRETS_KEY: "${VNEDGE_SECRETS_KEY:-}"
      VNEDGE_SECRETS_KEY_VERSION: "${VNEDGE_SECRETS_KEY_VERSION:-1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      MULTI_LANE_EXCHANGES: "${MULTI_LANE_EXCHANGES:-binanceusdm,bybit,delta_india}"
      MULTI_LANE_SYMBOLS: "${MULTI_LANE_SYMBOLS:-BTC/USDT:USDT}"
      MULTI_LANE_TIMEFRAME: "${MULTI_LANE_TIMEFRAME:-1h}"
      # Empty/off is intentional. Both must be supplied for a PAPER lane.
      MULTI_LANE_CAPITAL_ENABLED: "${MULTI_LANE_CAPITAL_ENABLED:-0}"
      MULTI_LANE_CAPITAL_STRATEGY: "${MULTI_LANE_CAPITAL_STRATEGY:-}"
      MULTI_LANE_CAPITAL_EXCHANGE: "${MULTI_LANE_CAPITAL_EXCHANGE:-binanceusdm}"
      MULTI_LANE_CAPITAL_SYMBOL: "${MULTI_LANE_CAPITAL_SYMBOL:-BTC/USDT:USDT}"
      MULTI_LANE_CAPITAL_TIMEFRAME: "${MULTI_LANE_CAPITAL_TIMEFRAME:-1h}"
      # Optional virtual-only research observation. Both gates are required.
      MULTI_LANE_SHADOW_OBSERVE_ENABLED: "${MULTI_LANE_SHADOW_OBSERVE_ENABLED:-0}"
      MULTI_LANE_SHADOW_OBSERVE_STRATEGY: "${MULTI_LANE_SHADOW_OBSERVE_STRATEGY:-}"
      MULTI_LANE_SHADOW_OBSERVE_EXCHANGE: "${MULTI_LANE_SHADOW_OBSERVE_EXCHANGE:-binanceusdm}"
      MULTI_LANE_SHADOW_OBSERVE_SYMBOL: "${MULTI_LANE_SHADOW_OBSERVE_SYMBOL:-BTC/USDT:USDT}"
      MULTI_LANE_SHADOW_OBSERVE_SYMBOLS: "${MULTI_LANE_SHADOW_OBSERVE_SYMBOLS:-}"
      MULTI_LANE_SHADOW_OBSERVE_TIMEFRAME: "${MULTI_LANE_SHADOW_OBSERVE_TIMEFRAME:-1h}"
      MULTI_LANE_SHADOW_OBSERVE_EQUITY: "${MULTI_LANE_SHADOW_OBSERVE_EQUITY:-500}"
      MULTI_LANE_SHADOW_OBSERVE_DAILY_LOSS_USD: "${MULTI_LANE_SHADOW_OBSERVE_DAILY_LOSS_USD:-10}"
      MULTI_LANE_SHADOW_OBSERVE_TRAIL_ATR_MULT: "${MULTI_LANE_SHADOW_OBSERVE_TRAIL_ATR_MULT:-0}"
      # Versioned multi-strategy replacement for the singleton fields above.
      # Setting a path is the explicit opt-in; mixing both contracts fails startup.
      MULTI_LANE_SHADOW_OBSERVE_ROSTER_PATH: "${MULTI_LANE_SHADOW_OBSERVE_ROSTER_PATH:-}"
      # Optional fixed isolated-margin sizing for PAPER/SHADOW only. The live
      # runtime rejects this profile structurally. Leverage is capped at 30x
      # and automatically reduced when required to preserve liquidation room.
      MULTI_LANE_FIXED_MARGIN: "${MULTI_LANE_FIXED_MARGIN:-}"
      MULTI_LANE_FIXED_MARGIN_LEVERAGE: "${MULTI_LANE_FIXED_MARGIN_LEVERAGE:-30}"
      MULTI_LANE_DAILY_LOSS_HALT: "${MULTI_LANE_DAILY_LOSS_HALT:-1}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    mem_limit: 1500m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./research/live_research:/app/research/live_research:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Public-trade measurement service for Market Pulse. It has no credentials,
  # order adapter, strategy, or capital path and never substitutes venue OHLCV
  # for exact trade-derived VWAP.
  pulse-recorder:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.exchange.tick_recorder
      - --exchange
      - binanceusdm
      - --symbols
      - BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT
      - --data-root
      - data
      - --candle-root
      - data/candles
      - --trades-only
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time,sys;
          files=list(pathlib.Path('data/ticks/exchange=binanceusdm').glob('symbol=*/stream=trades/*/*.parquet'));
          sys.exit(0 if files and time.time()-max(p.stat().st_mtime for p in files)<180 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # Explicit fail-closed repair worker. The recorder only detects/publishes
  # holes; this worker repairs Binance storage_hole records from aggregate
  # trades with strict contiguous trade-ID proof, then deterministically
  # rebuilds the canonical candle ladder. A failed proof leaves the gap open.
  gap-recovery:
    build: .
    restart: unless-stopped
    depends_on:
      pulse-recorder:
        condition: service_started
    command:
      - sh
      - -c
      - |
        while true; do
          python -m vnedge.data.binance_gap_recovery \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --data-root data \
            --candle-root data/candles \
            --gap-root data/gaps \
            --report data/reports/binance_gap_recovery.json
          sleep 900
        done
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # Binance REST retains aggTrades for only two days. Official Vision daily
  # archives own older storage holes; replay stays trade-derived and never
  # substitutes exchange OHLCV. Existing day archives are skipped.
  vision-recovery:
    build: .
    restart: unless-stopped
    environment:
      VISION_BACKFILL_DAYS: "${VISION_BACKFILL_DAYS:-7}"
    command:
      - sh
      - -c
      - |
        while true; do
          python -m vnedge.data.aggtrades_backfill \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --days "$${VISION_BACKFILL_DAYS}" \
            --data-root data \
            --exchange binanceusdm_hist
          python -m vnedge.data.candle_bootstrap \
            --symbols BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT \
            --days "$${VISION_BACKFILL_DAYS}" \
            --data-root data \
            --candle-root data/candles \
            --source-exchange binanceusdm_hist \
            --target-exchange binanceusdm
          sleep 86400
        done
    volumes:
      - ./data:/app/data
    mem_limit: 1400m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  tick-lake-maintenance:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.data.tick_lake_maintenance
      - --data-root
      - data
      - --interval-seconds
      - "86400"
    volumes:
      - ./data:/app/data
    mem_limit: 1200m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}


  # L2 order-book recorder. Separate from pulse-recorder, which is
  # deliberately --trades-only for Market Pulse. Book recording died on
  # 2026-08-02 12:46 UTC and nothing restarted it because no service owned it;
  # the whole point of this entry is that the L2 lake now has an owner with a
  # restart policy and a healthcheck that fails when book files go stale.
  book-recorder:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - vnedge.exchange.tick_recorder
      - --exchange
      - binanceusdm
      - --symbols
      - BTC/USDT:USDT,ETH/USDT:USDT
      - --data-root
      - data
      - --books-only
    volumes:
      - ./data:/app/data
    # The 50-level ladder is far heavier than the trade stream; 600m (the
    # pulse-recorder budget) is not enough for it.
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time,sys;
          files=list(pathlib.Path('data/ticks/exchange=binanceusdm').glob('symbol=*/stream=book/*/*.parquet'));
          sys.exit(0 if files and time.time()-max(p.stat().st_mtime for p in files)<300 else 1)
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
  research-loop:
    profiles: ["research"]
    build: .
    restart: unless-stopped
    command: ["python", "-m", "vnedge.research.continuous_research"]
    environment:
      RESEARCH_INTERVAL_SECONDS: "${RESEARCH_INTERVAL_SECONDS:-3600}"
      RESEARCH_EXCHANGES: "${RESEARCH_EXCHANGES:-binanceusdm,bybit,delta_india}"
      RESEARCH_SYMBOLS: "${RESEARCH_SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT}"
      RESEARCH_STRATEGIES: "${RESEARCH_STRATEGIES:-}"
      ALPHA_FACTORY_ENABLED: "0"
    volumes:
      - ./data:/app/data
      - ./research/live_research:/app/research/live_research
      - ./logs:/app/logs:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dashboard-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      multi-lane-shadow:
        condition: service_healthy
    environment:
      DASHBOARD_ALLOWLIST: "${DASHBOARD_ALLOWLIST:-}"
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:-}"
    command:
      - sh
      - -c
      - |
        DASHBOARD_ALLOWLIST="$$(printf '%s' "$$DASHBOARD_ALLOWLIST" | tr ',' ' ')"
        if [ -z "$$(printf '%s' "$$DASHBOARD_ALLOWLIST" | tr -d ' ')" ]; then
            unset DASHBOARD_ALLOWLIST
        else
            export DASHBOARD_ALLOWLIST
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
