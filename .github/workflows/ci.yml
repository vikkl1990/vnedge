name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Offline test suite
        run: python -m pytest -q -m "not network"
      - name: Ruff safety/runtime ratchet
        run: >-
          python -m ruff check
          src/vnedge/execution/journal.py
          src/vnedge/execution/trigger_engine.py
          src/vnedge/execution/exit_engine.py
          src/vnedge/dashboard/correction_ui.py
          src/vnedge/dashboard/market_pulse.py
          src/vnedge/data/candles.py
          src/vnedge/data/candle_bootstrap.py
          src/vnedge/data/gaps.py
          src/vnedge/data/swings.py
          src/vnedge/data/vwap.py
          src/vnedge/exchange/tick_recorder.py
          src/vnedge/exchange/live_feed.py
          src/vnedge/exchange/feed_registry.py
          src/vnedge/risk/risk_manager.py
          src/vnedge/exchange/readonly_account.py
          src/vnedge/runtime/fleet_policy.py
          src/vnedge/runtime/scanner_session.py
          src/vnedge/runtime/squeeze_observe.py
          src/vnedge/runtime/expansion_acceptance.py
          src/vnedge/runtime/squeeze_acceptance_observe.py
          src/vnedge/runtime/live_paper.py
          src/vnedge/runtime/live_trader_main.py
          src/vnedge/runtime/multi_lane_shadow.py
          src/vnedge/research/continuous_research.py
          src/vnedge/strategy/measurement_only.py
          src/vnedge/strategy/squeeze_expansion_breakout.py
          src/vnedge/strategy/squeeze_expansion_breakout_v3.py
          src/vnedge/strategy/range_expansion_observer.py
          src/vnedge/strategy/strategy_registry.py
      - name: Mypy safety/runtime ratchet
        run: >-
          python -m mypy --ignore-missing-imports
          src/vnedge/execution/journal.py
          src/vnedge/execution/trigger_engine.py
          src/vnedge/execution/exit_engine.py
          src/vnedge/dashboard/correction_ui.py
          src/vnedge/dashboard/market_pulse.py
          src/vnedge/data/candles.py
          src/vnedge/data/candle_bootstrap.py
          src/vnedge/data/gaps.py
          src/vnedge/data/swings.py
          src/vnedge/data/vwap.py
          src/vnedge/exchange/tick_recorder.py
          src/vnedge/exchange/live_feed.py
          src/vnedge/exchange/feed_registry.py
          src/vnedge/risk/risk_manager.py
          src/vnedge/exchange/readonly_account.py
          src/vnedge/runtime/fleet_policy.py
          src/vnedge/runtime/scanner_session.py
          src/vnedge/runtime/squeeze_observe.py
          src/vnedge/runtime/expansion_acceptance.py
          src/vnedge/runtime/squeeze_acceptance_observe.py
          src/vnedge/runtime/live_trader_main.py
          src/vnedge/runtime/multi_lane_shadow.py
          src/vnedge/research/continuous_research.py
          src/vnedge/strategy/measurement_only.py
          src/vnedge/strategy/squeeze_expansion_breakout.py
          src/vnedge/strategy/squeeze_expansion_breakout_v3.py
          src/vnedge/strategy/range_expansion_observer.py
          src/vnedge/strategy/strategy_registry.py
      - name: Ruff full-package debt visibility
        continue-on-error: true
        run: python -m ruff check src/vnedge --statistics
      - name: Mypy full-package debt visibility
        continue-on-error: true
        run: python -m mypy --ignore-missing-imports src/vnedge

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
